<!doctype html>
<html>
<head><meta charset="utf-8"><title>Inline box</title></head>
<body>
  <h1>Inline after block</h1>
  <!-- an inline element right after a block sibling: Obscura can lay it out with a 0x0 box -->
  <div id="wrap"><div class="block">Block sibling here</div><span id="inline">Inline after block phrase</span></div>
</body>
</html>
