<!doctype html>
<html>
<head><meta charset="utf-8"><title>Keycode</title></head>
<body>
  <h1>Keycode handler</h1>
  <input id="box" name="box">
  <ul id="list"></ul>
  <script>
    // classic TodoMVC-style handler: gated on the legacy keyCode, not e.key
    document.getElementById('box').addEventListener('keydown', function (e) {
      if (e.keyCode === 13) {
        var li = document.createElement('li');
        li.textContent = 'enter kc=' + e.keyCode + ' which=' + e.which;
        document.getElementById('list').appendChild(li);
        e.target.value = '';
      }
    });
  </script>
</body>
</html>
