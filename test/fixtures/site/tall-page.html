<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tall page</title>
  <style>
    body { margin: 0; background: #ffffff; }
    #top { height: 60px; background: #ffffff; }
    #spacer { height: 3000px; background: #ffffff; }
    /* a distinctively coloured target far below the fold, at the top-left of its own box */
    #target { width: 240px; height: 160px; background: #ff0000; }
    #tail { height: 600px; background: #ffffff; }
  </style>
</head>
<body>
  <div id="top">top of page</div>
  <div id="spacer">spacer</div>
  <div id="target"></div>
  <div id="tail"></div>
</body>
</html>
