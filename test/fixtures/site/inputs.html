<!doctype html>
<html>
<head><meta charset="utf-8"><title>Inputs Fixture</title></head>
<body>
  <h1>Input types</h1>
  <label for="age">Age</label> <input id="age" name="age" type="number" value="1">
  <label for="code">Code</label> <input id="code" name="code" maxlength="4" value="ab">
  <label for="when">Date</label> <input id="when" name="when" type="date">
  <label for="otp">One-time code</label> <input id="otp" name="otp" autocomplete="one-time-code">
  <div role="checkbox" id="fancy" aria-checked="false" tabindex="0" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true')">Fancy toggle</div>
  <div role="checkbox" id="stuck" aria-checked="false" tabindex="0">Stuck toggle</div>
  <select id="lang" onchange="location.href = '/page2.html?lang=' + this.value"><option value="en">English</option><option value="de">Deutsch</option></select>
</body>
</html>
