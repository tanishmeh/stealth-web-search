# Stealth Web Search — docker compose up -d --build
#
# MCP endpoint:    http://127.0.0.1:8931/mcp
# Live dashboard:  http://127.0.0.1:8931/
# Logs:            ./logs/ (JSON lines, rotated daily / by size; sub-agent transcripts in ./logs/agent-runs/)
# Scripts:         the "scripts" volume (automation scripts made by agent_automate)
#
# Configure with a .env file next to this one (copy .env.example). Sub-agents need a model:
# config/models.json (copy config/models.example.json) or AGENT_LLM_URL in .env.

name: stealth-web-search

services:
  stealth-web-search:
    build:
      context: .
      args:
        OBSCURA_VERSION: ${OBSCURA_VERSION:-v0.2.2}
    image: stealth-web-search:latest
    container_name: stealth-web-search
    env_file:
      - path: .env
        required: false
    environment:
      # HOST and PORT are fixed for Compose: inside the container the server must bind 0.0.0.0:8931,
      # the port the image publishes and health-checks. Change the published host port with HOST_PORT
      # (below), never PORT. These override any HOST/PORT set in .env.
      HOST: 0.0.0.0
      PORT: 8931
      # A PUBLIC_URL set in .env wins; otherwise it defaults to the published host-loopback URL.
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:${HOST_PORT:-8931}}
    ports:
      # Published on the host loopback only. The MCP endpoint controls a browser: do not expose
      # it to your network without AUTH_TOKEN and a reverse proxy.
      - "127.0.0.1:${HOST_PORT:-8931}:8931"
    volumes:
      - ./logs:/app/logs
      # The sub-agents' model settings: copy config/models.example.json to config/models.json.
      - ./config:/app/config:ro
      # Automation scripts survive rebuilds and restarts. To keep them in a host folder instead, replace
      # this line with "- ./scripts-data:/data/scripts" (the folder must be writable by uid 1000).
      - scripts:/data/scripts
      # Persist cookies between restarts: uncomment and set OBSCURA_STORAGE_DIR=/data/cookies in .env
      # (on Linux: mkdir -p data && sudo chown -R 1000:1000 data)
      # - ./data:/data/cookies
    extra_hosts:
      # Lets the browser reach services on your machine (with ALLOW_PRIVATE_NETWORK=true) on Linux too.
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped

volumes:
  scripts:
